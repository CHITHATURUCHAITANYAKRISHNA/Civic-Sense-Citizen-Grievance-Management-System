# =====================================================
# APPLICATION NAME
# =====================================================
spring.application.name=civicsense

# =====================================================
# DATABASE CONFIGURATION (MySQL)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/civicsense_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=MySql@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =====================================================
# SERVER CONFIGURATION
# =====================================================
server.port=8080

# Show real errors in browser (VERY IMPORTANT for debugging)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
spring.servlet.multipart.enabled=true

# Maximum size of single file
spring.servlet.multipart.max-file-size=100MB

# Maximum total request size (multiple files)
spring.servlet.multipart.max-request-size=200MB

# =====================================================
# THYMELEAF
# =====================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# =====================================================
# LOGGING
# =====================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# =====================================================
# MAIL CONFIGURATION (Password Reset)
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=chchaitanyakrishna238@gmail.com
spring.mail.password=tknmdscktyshbahk

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================
# TOMCAT (IMPORTANT for large uploads)
# =====================================================
server.tomcat.max-swallow-size=200MB
server.tomcat.max-http-form-post-size=200MB

# =====================================================
# STATIC FILE SERVING
# =====================================================
spring.web.resources.static-locations=classpath:/static/,file:uploads/

