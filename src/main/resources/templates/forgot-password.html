<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Forgot Password - CivicSense</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<style>
/* ===================== BODY & GLOBAL STYLES ===================== */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: url('/images/background7.jpg') no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding-top: 60px; /* for navbar */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* container centered, footer at bottom */
    position: relative;
    transition: 0.4s;
}

body.dark { background:#0f172a; color:white; }

body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.25);
    z-index: -1;
}

/* ===================== NAVBAR ===================== */
.logo{ display:flex; align-items:center; gap:8px; }
.logo-icon{
    width:24px; height:24px;
    border-radius:50%;
    background:linear-gradient(135deg,#10b981,#059669);
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:700; font-size:12px;
    box-shadow:0 0 12px rgba(16,185,129,0.6); position:relative;
    animation:logoFloat 3s ease-in-out infinite alternate;
}
.navbar .logo h2 { color: #111827; }

.logo-icon::before{
    content:''; position:absolute; width:36px; height:36px;
    border-radius:50%;
    border:2px solid rgba(16,185,129,0.4);
    animation:rotateRing 6s linear infinite;
}
@keyframes rotateRing{from{ transform:rotate(0deg); } to{ transform:rotate(360deg); }}
@keyframes logoFloat{
    0%{ transform:translateY(0px); box-shadow:0 0 8px rgba(16,185,129,0.5);}
    100%{ transform:translateY(-6px); box-shadow:0 0 20px rgba(16,185,129,0.9);}
}

.navbar{
    position:fixed; top:0; width:100%; padding:2px 30px;
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,0.7); backdrop-filter:blur(15px);
    box-shadow:0 5px 20px rgba(0,0,0,0.05); z-index:1000; transition:0.4s;
}
.navbar.scrolled{ padding:4px 30px; background:rgba(255,255,255,0.9); box-shadow:0 6px 25px rgba(0,0,0,0.1);}
.navbar a{ text-decoration:none; margin-left:15px; color:#374151; font-weight:500; transition:.3s; }
.navbar a:hover{ color:#059669; }
.btn-nav{ background:linear-gradient(135deg,#10b981,#059669); color:white!important; padding:6px 14px; border-radius:20px; }
.dark-toggle{ cursor:pointer; margin-left:15px; font-size:16px; }

/* ===================== FORGOT PASSWORD CONTAINER ===================== */
.main-content {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    padding: 20px;
}

.container {
    background: #fff;
    padding: 45px 55px;
    border-radius: 14px;
    width: 360px;
    text-align: center;
    position: relative;
    z-index: 1;

    opacity: 0;
    transform: translateY(25px);
    animation: fadeSlideUp 0.7s ease-out forwards, glowPulse 2.5s ease-in-out infinite alternate;

    box-shadow: 0 0 20px rgba(77,166,255,0.4);
}

@keyframes fadeSlideUp {
    to { opacity:1; transform: translateY(0); }
}

@keyframes glowPulse {
    0% { box-shadow: 0 0 18px rgba(77,166,255,0.35); }
    50% { box-shadow: 0 0 28px rgba(77,166,255,0.55); }
    100% { box-shadow: 0 0 18px rgba(77,166,255,0.35); }
}

h2 { color: #2980B9; margin-bottom: 20px; }

input[type=email] {
    width: 100%;
    padding: 12px;
    margin: 14px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #4da6ff;
    box-shadow: 0 0 8px rgba(77,166,255,0.35);
}

button {
    background-color: #4da6ff;
    color: white;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 18px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
}

button:hover {
    background-color: #3399ff;
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(77,166,255,0.4);
}

button:active {
    transform: translateY(0);
    box-shadow: 0 6px 12px rgba(77,166,255,0.25);
}

p { margin-top: 14px; font-size: 14px; }

.message { color: green; font-size: 0.9em; }
.error { color: red; font-size: 0.9em; }

a { color: #2980B9; text-decoration: none; font-weight: 500; transition: 0.3s; }
a:hover { text-decoration: underline; opacity: 0.8; }

/* ===================== FOOTER ===================== */
footer{
    background:#111827; color:#9ca3af; text-align:center; padding:15px;
    width:100%;
    font-size:13px;
}
</style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar" id="navbar">
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>
    <div>
        <a href="/">Home</a>
        <a href="/login">User</a>
        <a href="/login">Admin</a>
        <a href="/login">Department</a>
        <a href="/login">Login</a>
        <a href="/register" class="btn-nav">Register</a>
        <span class="dark-toggle" onclick="toggleDark()">🌙</span>
    </div>
</div>

<!-- ================= FORGOT PASSWORD FORM ================= -->
<div class="main-content">
    <div class="container">
        <h2>Forgot Password</h2>

        <form th:action="@{/forgot-password}" method="post">
            <div>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div>
                <button type="submit">Send Reset Link</button>
            </div>
        </form>

        <p th:if="${successMessage}" class="message" th:text="${successMessage}"></p>
        <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

        <p><a th:href="@{/login}">Back to Login</a></p>
    </div>
</div>

<!-- ================= FOOTER ================= -->
<footer>
    <div class="logo" style="justify-content:center;margin-bottom:8px;">
        <div class="logo-icon">CS</div>
        <h2 style="color:white; font-size:16px;">CivicSense</h2>
    </div>
    © 2026 CivicSense | Smart Governance System
</footer>

<script>
    // ================= SCROLL NAVBAR =================
    window.addEventListener("scroll",()=>{ document.getElementById("navbar").classList.toggle("scrolled",window.scrollY>50); });

    // ================= DARK MODE =================
    function toggleDark(){ document.body.classList.toggle("dark"); }
</script>

</body>
</html>
