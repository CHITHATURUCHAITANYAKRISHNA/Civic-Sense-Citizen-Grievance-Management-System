<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Update Complaint Status</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            transition: 0.4s;
        }

        .container {
            max-width: 700px;
            margin: 120px auto 50px auto; /* pushed down for navbar */
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        h1 {
            color: #004085;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button.submit-btn {
            padding: 12px;
            background-color: #004085;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.2s;
        }

        button.submit-btn:hover {
            background-color: #003366;
        }

        a.back-link {
            display: inline-block;
            margin-top: 20px;
            color: #004085;
            font-weight: bold;
            text-decoration: none;
        }

        a.back-link:hover {
            text-decoration: underline;
        }

        .issue-details {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .issue-details img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 6px;
        }

        /* ================= NAVBAR ================= */
        .logo{
            display:flex;
            align-items:center;
            gap:10px;
        }
        .logo-icon{
            width:36px;
            height:36px;
            border-radius:50%;
            background:linear-gradient(135deg,#10b981,#059669);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-weight:700;
            font-size:16px;
            box-shadow:0 0 20px rgba(16,185,129,0.6);
            position:relative;
            animation:logoFloat 3s ease-in-out infinite alternate;
        }
        .logo-icon::before{
            content:'';
            position:absolute;
            width:52px;
            height:52px;
            border-radius:50%;
            border:2px solid rgba(16,185,129,0.4);
            animation:rotateRing 6s linear infinite;
        }
        @keyframes rotateRing{from{ transform:rotate(0deg);} to{ transform:rotate(360deg);}}
        @keyframes logoFloat{0%{transform:translateY(0px);} 100%{transform:translateY(-6px);}}

        .navbar{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            padding:18px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(15px);
            box-shadow:0 5px 25px rgba(0,0,0,0.05);
            z-index:1000;
            transition:0.4s;
        }
        .navbar h2{
            font-weight:700;
            color:#111827;
            margin:0;
            line-height:1;
        }
        .navbar.scrolled{
            padding:12px 60px;
            background:rgba(255,255,255,0.9);
            box-shadow:0 8px 30px rgba(0,0,0,0.1);
        }
        .navbar a{
            text-decoration:none;
            margin-left:20px;
            color:#374151;
            font-weight:500;
            transition:.3s;
        }
        .navbar a:hover{ color:#059669; }
        .btn-nav{
            background:linear-gradient(135deg,#10b981,#059669);
            color:white!important;
            padding:8px 18px;
            border-radius:25px;
        }
        .dark-toggle{
            cursor:pointer;
            margin-left:20px;
            font-size:18px;
        }

        footer{
            background:#111827;
            color:#9ca3af;
            padding:25px;
            margin-top:50px;
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
        }
        footer .logo{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:10px;
        }
        footer .logo h2{
            color:white;
            margin:0;
            line-height:1;
        }
    </style>
</head>
<body>

<!-- NAVBAR START -->
<div class="navbar" id="navbar">
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>
    <div>
        <a href="/">Home</a>
        <a href="/login">User</a>
        <a href="/login">Admin</a>
        <a href="/login">Department</a>
        <a href="/login">Login</a>
        <a href="/register" class="btn-nav">Register</a>
        <span class="dark-toggle" onclick="toggleDark()">🌙</span>
    </div>
</div>
<!-- NAVBAR END -->

<div class="container">

    <h1>Update Complaint Status</h1>

    <div class="issue-details">
        <p><strong>Title:</strong> <span th:text="${complaint.title}">Complaint Title</span></p>
        <p><strong>Category:</strong> <span th:text="${complaint.category}">Category</span></p>
        <p><strong>Current Status:</strong>
            <span th:text="${complaint.status}" th:class="'status-' + ${complaint.status.toString().toLowerCase()}"></span>
        </p>
        <div th:if="${complaint.imagePath != null}">
            <img th:src="@{${complaint.imagePath}}" alt="Complaint Image">
        </div>
    </div>

    <form th:action="@{'/admin/update-status/' + ${complaint.id}}" method="post">
        <label for="status">Select New Status:</label>
        <select name="status" id="status" required>
            <option th:each="st : ${statuses}"
                    th:value="${st}"
                    th:text="${st}"
                    th:selected="${st == complaint.status}">
            </option>
        </select>

        <button type="submit" class="submit-btn">Update Status</button>
    </form>

    <a th:href="@{/admin/complaints}" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Complaints
    </a>

</div>

<!-- FOOTER -->
<footer>
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>
    © 2026 CivicSense | Smart Governance System
</footer>

<!-- NAVBAR SCRIPT -->
<script>
window.addEventListener("scroll", ()=>{
    document.getElementById("navbar").classList.toggle("scrolled", window.scrollY > 50);
});

function toggleDark(){
    document.body.classList.toggle("dark");
}
</script>
</body>
</html>
