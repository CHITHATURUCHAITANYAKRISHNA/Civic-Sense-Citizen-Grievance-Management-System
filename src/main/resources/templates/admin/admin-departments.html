<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Departments - CivicSense</title>

<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
    font-family:'Inter', sans-serif;
    background-color:#f0f2f5;
    margin:0;
    padding:0;
    min-height:100vh;
    position:relative;
}

/* space for footer */
body::after{
    content:"";
    display:block;
    height:80px;
}

.container{
    max-width:900px;
    margin:140px auto 60px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:12px;
    text-align:left;
    border-bottom:1px solid #ddd;
}

th{
    background-color:#4CAF50;
    color:white;
}

tr:hover{
    background-color:#f1f1f1;
}

.btn{
    padding:6px 12px;
    border-radius:5px;
    text-decoration:none;
    color:white;
    font-size:14px;
    margin-right:5px;
    border:none;
    cursor:pointer;
}

.btn-edit{
    background-color:#2196F3;
}

.btn-edit:hover{
    background-color:#0b7dda;
}

.btn-delete{
    background-color:#f44336;
}

.btn-delete:hover{
    background-color:#da190b;
}

.back-link{
    display:block;
    margin-top:20px;
    text-align:center;
    color:#333;
    text-decoration:none;
    font-weight:600;
}

.back-link:hover{
    text-decoration:underline;
}

.add-btn{
    margin-bottom:15px;
    display:inline-block;
    background-color:#4CAF50;
    color:white;
    padding:8px 15px;
    border-radius:5px;
    text-decoration:none;
}

.add-btn:hover{
    background-color:#45a049;
}

/* ================= LOGO ================= */

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:linear-gradient(135deg,#10b981,#059669);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:700;
    font-size:16px;

    /* glow effect */
    box-shadow:0 0 20px rgba(16,185,129,0.6);

    /* animation */
    position:relative;
    animation:logoFloat 3s ease-in-out infinite alternate;
}

/* rotating ring */
.logo-icon::before{
    content:'';
    position:absolute;
    width:52px;
    height:52px;
    border-radius:50%;
    border:2px solid rgba(16,185,129,0.4);
    animation:rotateRing 6s linear infinite;
}

/* rotation animation */
@keyframes rotateRing{
    from{ transform:rotate(0deg);}
    to{ transform:rotate(360deg);}
}

/* floating animation */
@keyframes logoFloat{
    0%{ transform:translateY(0px);}
    100%{ transform:translateY(-6px);}
}

/* ================= NAVBAR ================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:18px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.9);
    box-shadow:0 5px 25px rgba(0,0,0,0.05);
    z-index:1000;
}

.navbar h2{
    font-weight:700;
    color:#111827;
    margin:0;
}

.navbar a{
    text-decoration:none;
    margin-left:20px;
    color:#374151;
    font-weight:500;
}

.navbar a:hover{
    color:#059669;
}

.btn-nav{
    background:linear-gradient(135deg,#10b981,#059669);
    color:white!important;
    padding:8px 18px;
    border-radius:25px;
}

/* ================= FOOTER ================= */

footer{
    position:absolute;
    bottom:0;
    width:100%;
    background:#111827;
    color:#9ca3af;
    padding:25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

footer .logo h2{
    color:white;
    margin:0;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>

    <div>
        <a href="/">Home</a>
        <a href="/login">User</a>
        <a href="/login">Admin</a>
        <a href="/login">Department</a>
        <a href="/login">Login</a>
        <a href="/register" class="btn-nav">Register</a>
    </div>
</div>

<!-- CONTAINER -->
<div class="container">

<h1>All Departments</h1>

<a th:href="@{/admin/departments/new}" class="add-btn">
Add New Department
</a>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Actions</th>
</tr>
</thead>

<tbody>

<tr th:each="dept : ${departments}">
<td th:text="${dept.id}">1</td>
<td th:text="${dept.name}">Department Name</td>

<td>

<a th:href="@{/admin/departments/edit/{id}(id=${dept.id})}" class="btn btn-edit">
Edit
</a>

<a th:href="@{/admin/departments/delete/{id}(id=${dept.id})}"
class="btn btn-delete"
onclick="if(!confirm('Are you sure you want to delete this department?')) { event.preventDefault(); }">
Delete
</a>

</td>
</tr>

<tr th:if="${#lists.isEmpty(departments)}">
<td colspan="3" style="text-align:center;">
No departments found.
</td>
</tr>

</tbody>
</table>

<a th:href="@{/admin/dashboard}" class="back-link">
← Back to Dashboard
</a>

</div>

<!-- FOOTER -->
<footer>

<div class="logo">
<div class="logo-icon">CS</div>
<h2>CivicSense</h2>
</div>

© 2026 CivicSense | Smart Governance System

</footer>

</body>
</html>
