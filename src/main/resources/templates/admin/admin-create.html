<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Admin - CivicSense</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== BODY & WRAPPER ===== */
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f3f5;
            display: block;
            position: relative;
            min-height: 100%;
        }
        .page-wrapper {
            padding-bottom: 100px; /* reserve space for footer */
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 500px;
            margin: 120px auto 60px auto; /* leave space for navbar */
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #004085;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
            width: 100%;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border: 2px solid #004085;
            box-shadow: 0 0 6px rgba(0,64,133,0.3);
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #004085;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #003366;
            transform: translateY(-2px);
        }

        /* ===== STATUS MESSAGES ===== */
        .message {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .error { background-color: #f8d7da; color: #721c24; }
        .success { background-color: #d4edda; color: #155724; }

        /* Back link */
        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #004085;
            font-weight: bold;
            transition: color 0.2s;
        }
        .back:hover { text-decoration: underline; color: #003366; }

        /* ================= NAVBAR ================= */
        .logo{ display:flex; align-items:center; gap:10px; }
        .logo-icon{
            width:36px; height:36px; border-radius:50%;
            background:linear-gradient(135deg,#10b981,#059669);
            display:flex; align-items:center; justify-content:center;
            color:white; font-weight:700; font-size:16px;
            box-shadow:0 0 20px rgba(16,185,129,0.6);
            position:relative;
            animation:logoFloat 3s ease-in-out infinite alternate;
        }
        .logo-icon::before{
            content:''; position:absolute; width:52px; height:52px; border-radius:50%;
            border:2px solid rgba(16,185,129,0.4); animation:rotateRing 6s linear infinite;
        }
        @keyframes rotateRing{from{ transform:rotate(0deg);} to{ transform:rotate(360deg);}}
        @keyframes logoFloat{0%{transform:translateY(0px);} 100%{transform:translateY(-6px);}}

        .navbar{
            position:fixed; top:0; left:0; width:100%;
            padding:18px 60px; display:flex; justify-content:space-between; align-items:center;
            background:rgba(255,255,255,0.7); backdrop-filter:blur(15px);
            box-shadow:0 5px 25px rgba(0,0,0,0.05); z-index:1000; transition:0.4s;
        }
        .navbar h2{ font-weight:700; color:#111827; margin:0; line-height:1; }
        .navbar.scrolled{
            padding:12px 60px; background:rgba(255,255,255,0.9);
            box-shadow:0 8px 30px rgba(0,0,0,0.1);
        }
        .navbar a{ text-decoration:none; margin-left:20px; color:#374151; font-weight:500; transition:.3s; }
        .navbar a:hover{ color:#059669; }
        .btn-nav{ background:linear-gradient(135deg,#10b981,#059669); color:white!important; padding:8px 18px; border-radius:25px; }
        .dark-toggle{ cursor:pointer; margin-left:20px; font-size:18px; }

        /* ================= FOOTER ================= */
        footer{
            background:#111827;
            color:#9ca3af;
            padding:25px;
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
            position:absolute;
            left:0; bottom:0; width:100%;
        }
        footer .logo{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:10px;
        }
        footer .logo h2{
            color:white; margin:0; line-height:1;
        }
    </style>
</head>

<body>
<div class="page-wrapper">
    <!-- NAVBAR -->
    <div class="navbar" id="navbar">
        <div class="logo">
            <div class="logo-icon">CS</div>
            <h2>CivicSense</h2>
        </div>
        <div>
            <a href="/">Home</a>
            <a href="/login">User</a>
            <a href="/login">Admin</a>
            <a href="/login">Department</a>
            <a href="/login">Login</a>
            <a href="/register" class="btn-nav">Register</a>
            <span class="dark-toggle" onclick="toggleDark()">🌙</span>
        </div>
    </div>

    <!-- CONTAINER -->
    <div class="container">
        <h1>Create Admin</h1>

        <div th:if="${error}" class="message error" th:text="${error}"></div>
        <div th:if="${message}" class="message success" th:text="${message}"></div>

        <form th:action="@{/admin/create}" th:object="${user}" method="post">
            <input type="text" th:field="*{username}" placeholder="Username" required />
            <input type="email" th:field="*{email}" placeholder="Email" required />
            <input type="password" th:field="*{password}" placeholder="Password" required />
            <button type="submit"><i class="fas fa-user-plus"></i> Create Admin</button>
        </form>

        <a th:href="@{/admin/dashboard}" class="back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>

<!-- FOOTER -->
<footer>
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>
    © 2026 CivicSense | Smart Governance System
</footer>

<script>
window.addEventListener("scroll",()=>{
    document.getElementById("navbar").classList.toggle("scrolled",window.scrollY>50);
});
function toggleDark(){ document.body.classList.toggle("dark"); }
</script>

</body>
</html>
