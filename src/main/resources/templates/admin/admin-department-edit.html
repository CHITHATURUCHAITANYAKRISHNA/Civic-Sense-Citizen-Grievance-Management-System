```html id="c1k9vf"
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Department | CivicSense</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

html,body{height:100%;}

body{
background:#f4f6f9;
display:flex;
flex-direction:column;
min-height:100vh;
overflow-x:hidden;
}

/* LOGO */

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo h2{
margin:0;
font-size:22px;
}

.logo-icon{
width:34px;
height:34px;
border-radius:50%;
background:linear-gradient(135deg,#10b981,#059669);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:700;
font-size:15px;
box-shadow:0 0 18px rgba(16,185,129,0.7);
position:relative;

/* floating animation */
animation:logoFloat 3s ease-in-out infinite alternate;
}

/* rotating ring */

.logo-icon::before{
content:'';
position:absolute;
width:46px;
height:46px;
border-radius:50%;
border:2px solid rgba(16,185,129,0.4);
animation:rotateRing 6s linear infinite;
}

@keyframes rotateRing{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@keyframes logoFloat{
0%{transform:translateY(0px);}
100%{transform:translateY(-5px);}
}

/* NAVBAR */

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
padding:16px 60px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
box-shadow:0 4px 20px rgba(0,0,0,0.08);
z-index:1000;
}

.navbar a{
text-decoration:none;
margin-left:20px;
color:#374151;
font-weight:500;
font-size:15px;
}

.navbar a:hover{
color:#059669;
}

.btn-nav{
background:linear-gradient(135deg,#10b981,#059669);
color:white!important;
padding:7px 18px;
border-radius:22px;
}

/* PAGE */

.page-wrapper{
flex:1;
padding-top:120px;
padding-bottom:40px;
display:flex;
justify-content:center;
align-items:flex-start;
}

.container{
width:520px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

h2{
margin-bottom:25px;
color:#111827;
font-weight:600;
}

label{
display:block;
margin-top:20px;
font-weight:600;
color:#374151;
}

input[type="text"]{
width:100%;
padding:12px;
margin-top:8px;
border-radius:10px;
border:1px solid #d1d5db;
}

input[type="text"]:focus{
border-color:#10b981;
outline:none;
box-shadow:0 0 0 3px rgba(16,185,129,0.2);
}

.btn{
margin-top:30px;
padding:12px 20px;
background:linear-gradient(135deg,#10b981,#059669);
color:white;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:600;
}

.btn:hover{
transform:scale(1.05);
}

.error{
color:red;
margin-top:5px;
}

.back-link{
display:inline-block;
margin-top:20px;
color:#059669;
font-weight:600;
text-decoration:none;
}

.back-link:hover{
text-decoration:underline;
}

/* FOOTER */

footer{
background:#111827;
color:#9ca3af;
padding:25px;
text-align:center;
margin-top:auto;
}

footer .logo{
justify-content:center;
margin-bottom:10px;
}

footer .logo h2{
color:white;
font-size:22px;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
<div class="logo-icon">CS</div>
<h2>CivicSense</h2>
</div>

<div>
<a href="/">Home</a>
<a href="/login">User</a>
<a href="/login">Admin</a>
<a href="/login">Department</a>
<a href="/login">Login</a>
<a href="/register" class="btn-nav">Register</a>
</div>

</div>

<!-- FORM SECTION -->

<div class="page-wrapper">
<div class="container">

<h2><i class="fas fa-edit"></i> Edit Department</h2>

<form th:action="@{/admin/departments/edit/{id}(id=${department.id})}"
th:object="${department}"
method="post">

<input type="hidden" th:field="*{id}" />

<label for="name">Department Name</label>

<input type="text"
id="name"
th:field="*{name}"
required />

<div th:if="${#fields.hasErrors('name')}"
th:errors="*{name}"
class="error"></div>

<button type="submit" class="btn">
<i class="fas fa-save"></i> Update Department
</button>

</form>

<a th:href="@{/admin/departments}" class="back-link">
<i class="fas fa-arrow-left"></i> Back to Departments List
</a>

</div>
</div>

<!-- FOOTER -->

<footer>

<div class="logo">
<div class="logo-icon">CS</div>
<h2>CivicSense</h2>
</div>

© 2026 CivicSense | Smart Governance System

</footer>

</body>
</html>
