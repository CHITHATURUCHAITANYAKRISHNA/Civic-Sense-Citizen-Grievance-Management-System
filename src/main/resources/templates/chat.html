<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Issue Chat - CivicSense</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
            transition: 0.4s;
            position: relative; /* needed for footer absolute positioning */
            min-height: 100vh;
        }

        /* NAVBAR */
        .logo{display:flex;align-items:center;gap:10px;}
        .logo-icon{
            width:36px;height:36px;border-radius:50%;
            background:linear-gradient(135deg,#10b981,#059669);
            display:flex;align-items:center;justify-content:center;
            color:white;font-weight:700;font-size:16px;
            box-shadow:0 0 20px rgba(16,185,129,0.6);
            position:relative;
            animation:logoFloat 3s ease-in-out infinite alternate;
        }
        .logo-icon::before{
            content:'';position:absolute;width:52px;height:52px;
            border-radius:50%;border:2px solid rgba(16,185,129,0.4);
            animation:rotateRing 6s linear infinite;
        }
        @keyframes rotateRing{from{ transform:rotate(0deg);} to{ transform:rotate(360deg);}}
        @keyframes logoFloat{0%{transform:translateY(0px);} 100%{transform:translateY(-6px);}}

        .navbar{
            position:fixed;top:0;left:0;width:100%;
            padding:18px 60px;display:flex;justify-content:space-between;align-items:center;
            background:rgba(255,255,255,0.7);backdrop-filter:blur(15px);
            box-shadow:0 5px 25px rgba(0,0,0,0.05);z-index:1000;transition:0.4s;
        }
        .navbar.scrolled{padding:12px 60px;background:rgba(255,255,255,0.9);box-shadow:0 8px 30px rgba(0,0,0,0.1);}
        .navbar h2{font-weight:700;color:#111827;margin:0;line-height:1;}
        .navbar a{text-decoration:none;margin-left:20px;color:#374151;font-weight:500;transition:.3s;}
        .navbar a:hover{color:#059669;}
        .btn-nav{background:linear-gradient(135deg,#10b981,#059669);color:white!important;padding:8px 18px;border-radius:25px;}
        .dark-toggle{cursor:pointer;margin-left:20px;font-size:18px;}

        /* CHAT STYLES */
        .chat-container {
            max-width: 900px;
            margin: 120px auto 40px auto; /* keep original */
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: 75vh; /* keep original */
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2a5298;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .user-message {
            background: #d1ecf1;
            align-self: flex-end;
        }

        .admin-message {
            background: #f8d7da;
            align-self: flex-start;
        }

        .meta {
            font-size: 11px;
            color: gray;
            margin-top: 5px;
        }

        .chat-form {
            display: flex;
            margin-top: 15px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }

        .chat-form input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
        }

        .chat-form button {
            margin-left: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2a5298;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .chat-form button:hover {
            background: #1e3c72;
        }

        .back-btn {
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 10px;
            display: inline-block;
            color: #2a5298;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        /* FOOTER (absolute at bottom) */
        footer {
            background:#111827;
            color:#9ca3af;
            padding:25px;
            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        footer .logo{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
        footer .logo-icon{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px;}
    </style>

    <script>
        window.onload = function() {
            const messages = document.querySelector('.messages');
            if (messages) messages.scrollTop = messages.scrollHeight;
        };

        function goBack() {
            if(document.referrer !== "") window.history.back();
            else window.location.href = "/admin/dashboard";
        }
    </script>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar" id="navbar">
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>
    <div>
        <a href="/">Home</a>
        <a href="/login">User</a>
        <a href="/login">Admin</a>
        <a href="/login">Department</a>
        <a href="/login">Login</a>
        <a href="/register" class="btn-nav">Register</a>
        <span class="dark-toggle" onclick="document.body.classList.toggle('dark')">🌙</span>
    </div>
</div>

<!-- CHAT -->
<div class="chat-container">
    <a href="javascript:void(0)" class="back-btn" onclick="goBack()">← Back</a>

    <div class="chat-header">
        Chat for Issue ID: <span th:text="${issue.id}"></span>
    </div>

    <div th:if="${#lists.isEmpty(messages)}" style="color:gray;">No messages yet. Start the conversation.</div>

    <div class="messages">
        <div th:each="msg : ${messages}"
             th:class="'message ' + (${msg.senderRole} == 'ROLE_ADMIN' ? 'admin-message' : 'user-message')">
            <div th:text="${msg.message}"></div>
            <div class="meta">
                <span th:text="${msg.senderEmail}"></span> |
                <span th:text="${msg.timestamp}"></span>
            </div>
        </div>
    </div>

    <form class="chat-form" th:action="@{/chat/send}" method="post">
        <input type="hidden" name="issueId" th:value="${issue.id}" />
        <input type="text" name="message" placeholder="Type your message..." required />
        <button type="submit">Send</button>
    </form>
</div>

<!-- FOOTER -->
<footer>
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2 style="color:white;margin:0;line-height:1;">CivicSense</h2>
    </div>
    © 2026 CivicSense | Smart Governance Systemch
</footer>

<script>
window.addEventListener("scroll",()=>{document.getElementById("navbar").classList.toggle("scrolled",window.scrollY>50);});
</script>

</body>
</html>
