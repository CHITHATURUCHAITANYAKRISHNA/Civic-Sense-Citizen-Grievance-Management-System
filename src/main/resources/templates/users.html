<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode { background-color: #121212; color: #fff; }

        .container { max-width: 1000px; margin: 50px auto; padding: 30px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        header h1 { color: #2980B9; margin: 0; }
        body.dark-mode header h1 { color: #4da6ff; }

        header a { text-decoration: none; color: #2980B9; font-weight: bold; }
        header a:hover { text-decoration: underline; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        body.dark-mode table { background: #1e1e1e; }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        body.dark-mode th, body.dark-mode td { border-bottom: 1px solid #555; }

        th { background-color: #2980B9; color: #fff; }
        body.dark-mode th { background-color: #4da6ff; color: #000; }

        tr:hover { background-color: #f1f1f1; }
        body.dark-mode tr:hover { background-color: #333; }

        .actions button {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #2980B9;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .actions button:hover { background: #1f6391; }
        body.dark-mode .actions button { background: #4da6ff; color: #000; }
        body.dark-mode .actions button:hover { background: #1a75d1; }

        #darkModeToggle {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #2980B9;
            color: white;
            cursor: pointer;
        }
        #darkModeToggle:hover { background-color: #1f6391; }

        .message { padding: 10px; margin-bottom: 15px; border-radius: 5px; font-weight: bold; text-align: center; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        body.dark-mode .success { background-color: #1b5a2f; color: #d4edda; }
        body.dark-mode .error { background-color: #5a1b1f; color: #f8d7da; }
    </style>
</head>
<body>

<!-- Dark Mode Toggle -->
<button id="darkModeToggle"><i class="fas fa-moon"></i> Dark Mode</button>

<div class="container">
    <header>
        <h1>All Users</h1>
        <a th:href="@{/admin/dashboard}"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </header>

    <!-- Success/Error Messages -->
    <div th:if="${message}" class="message success" th:text="${message}"></div>
    <div th:if="${error}" class="message error" th:text="${error}"></div>

    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user, iterStat : ${users}">
            <td th:text="${iterStat.count}">1</td>
            <td th:text="${user.username}">username</td>
            <td th:text="${user.email}">email@example.com</td>
            <td th:text="${user.role}">ROLE_USER</td>
            <td class="actions">
                <button type="button" th:onclick="'window.location.href=\'/admin/edit/' + ${user.id} + '\';'">
                    <i class="fas fa-edit"></i> Edit
                </button>
                <button type="button" th:onclick="'if(confirm(\'Are you sure you want to delete this user?\')) window.location.href=\'/admin/delete/' + ${user.id} + '\';'">
                    <i class="fas fa-trash"></i> Delete
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    const toggle = document.getElementById('darkModeToggle');
    toggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
    });
</script>

</body>
</html>
