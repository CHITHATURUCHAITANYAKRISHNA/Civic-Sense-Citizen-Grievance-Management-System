<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Activities - CivicSense</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode { background-color: #121212; color: #fff; }

        .container { max-width: 1000px; margin: 50px auto; padding: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 2rem; color: #2980B9; }
        header a { text-decoration: none; color: #2980B9; font-weight: bold; }
        header a:hover { text-decoration: underline; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
        }
        thead {
            background-color: #2980B9;
            color: white;
        }
        tbody tr:nth-child(even) { background-color: #f2f2f2; }
        body.dark-mode tbody tr:nth-child(even) { background-color: #1e1e1e; }
        tbody tr:hover { background-color: #ddd; }
        body.dark-mode tbody tr:hover { background-color: #333; }

        /* Dark mode toggle button */
        #darkModeToggle {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            background-color: #2980B9;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        #darkModeToggle:hover { background-color: #1f6391; }

        /* Responsive */
        @media (max-width: 600px) {
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            td { padding: 10px; position: relative; }
            td::before {
                content: attr(data-label);
                position: absolute;
                left: 10px;
                font-weight: bold;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>My Activities</h1>
        <div>
            <button id="darkModeToggle"><i class="fas fa-moon"></i> Dark Mode</button>
            <a th:href="@{/dashboard}" style="margin-left:15px;"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
    </header>

    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Activity Name</th>
            <th>Date</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="activity, iterStat : ${activities}">
            <td th:text="${iterStat.count}" data-label="#">1</td>
            <td th:text="${activity.name}" data-label="Activity Name">Activity Name</td>
            <td th:text="${activity.date}" data-label="Date">2026-01-27</td>
            <td th:text="${activity.status}" data-label="Status">Completed</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    const toggle = document.getElementById('darkModeToggle');
    toggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
    });
</script>
</body>
</html>
