<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Issue Details | CivicSense</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef1f5, #dbeafe);
            margin:0;
            padding:0;
        }

        .container {
            max-width: 950px;
            margin: 120px auto 0 auto;
            padding: 0 20px;
        }

        h1 {
            text-align:center;
            font-size:36px;
            font-weight:800;
            margin-bottom:45px;
            color:#1e293b;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #e6e8ec;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06),
                        0 5px 15px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 45px rgba(0,0,0,0.08),
                        0 10px 20px rgba(37,99,235,0.15);
        }

        .label {
            font-size:13px;
            font-weight:600;
            color:#7a7a7a;
            display:block;
            margin-bottom:8px;
        }

        .value {
            font-size:17px;
            font-weight:500;
            color:#2d2d2d;
            margin-bottom:18px;
        }

        .status {
            display:inline-block;
            padding:6px 16px;
            border-radius:50px;
            font-size:13px;
            font-weight:700;
            color:white;
            text-transform:uppercase;
        }

        .PENDING { background:#ef4444; }
        .IN_PROGRESS { background:#f59e0b; }
        .RESOLVED { background:#10b981; }
        .CLOSED { background:#64748b; }

        .issue-image {
            width:100%;
            max-height:420px;
            object-fit:cover;
            border-radius:14px;
            margin-top:15px;
        }

        #issue-map { width: 100%; height: 300px; border-radius: 12px; margin-top: 15px; }

        .logo{ display:flex; align-items:center; gap:8px; }
        .logo-icon{
            width:28px; height:28px;
            border-radius:50%;
            background:linear-gradient(135deg,#10b981,#059669);
            display:flex; align-items:center; justify-content:center;
            color:white; font-weight:700; font-size:14px;
            box-shadow:0 0 14px rgba(16,185,129,0.6);
        }

        .navbar{
            position:fixed; top:0; width:100%; height:70px; padding:10px 30px;
            display:flex; justify-content:space-between; align-items:center;
            background:rgba(255,255,255,0.9);
            box-shadow:0 6px 22px rgba(0,0,0,0.08);
            z-index:1000;
        }

        .navbar a{ text-decoration:none; margin-left:15px; color:#374151; font-weight:500; }
        .navbar a:hover{ color:#059669; }
        .btn-nav{ background:linear-gradient(135deg,#10b981,#059669); color:white!important; padding:6px 14px; border-radius:20px; }

        footer{
            background:#111827; color:#9ca3af; text-align:center; padding:15px;
            width:100%;
            font-size:13px;
            margin-top:20px;
        }

        footer .logo { display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:8px; }
        footer .logo h2 { color:white; font-size:16px; margin:0; }

        .floating-back {
            position: fixed;
            top: 80px;
            right: 20px;
            background-color: #007BFF;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>
    <div>
        <a href="/">Home</a>
        <a href="/login">User</a>
        <a href="/login">Admin</a>
        <a href="/login">Department</a>
        <a href="/login">Login</a>
        <a href="/register" class="btn-nav">Register</a>
    </div>
</div>

<a th:href="@{/issues}" class="floating-back">← Back to Issues</a>

<div class="container">

    <h1 th:text="${issue.title}">Issue Title</h1>

    <div class="card">
        <span class="label">Description</span>
        <p class="value" th:text="${issue.description}"></p>
    </div>

    <div class="card">
        <span class="label">Category</span>
        <span class="value" th:text="${issue.category}"></span>
    </div>

    <div class="card">
        <span class="label">Status</span>
        <span class="status"
              th:text="${issue.status}"
              th:classappend="' ' + ${issue.status}">
        </span>
    </div>

    <div class="card" th:if="${issue.department != null}">
        <span class="label">Assigned Department</span>
        <span class="value" th:text="${issue.department.name}"></span>
    </div>

    <div class="card">
        <span class="label">Reported By</span>
        <span class="value" th:text="${issue.user.username}"></span>
    </div>

    <div class="card">
        <span class="label">Reported On</span>
        <span class="value"
              th:text="${#temporals.format(issue.createdAt, 'dd MMM yyyy HH:mm')}">
        </span>
    </div>

    <div class="card">
        <span class="label">Discussion</span>
        <a th:href="@{/chat/{id}(id=${issue.id})}"
           style="display:inline-block;
                  padding:10px 18px;
                  background:linear-gradient(135deg,#2563eb,#1e40af);
                  color:white;
                  border-radius:8px;
                  text-decoration:none;
                  font-weight:600;">
            💬 Open Chat
        </a>
    </div>

    <!-- ✅ UPLOADED MEDIA (PLACED ABOVE LOCATION) -->
    <div class="card" th:if="${issue.imagePath != null or issue.imagePaths != null or issue.videoPath != null}">
        <span class="label">Uploaded Media</span>

        <img th:if="${issue.imagePath != null}"
             th:src="@{${issue.imagePath}}"
             class="issue-image"/>

        <div th:if="${issue.imagePaths != null}">
            <div th:each="img : ${#strings.arraySplit(issue.imagePaths, ',')}">
                <img th:src="@{${img}}" class="issue-image"/>
            </div>
        </div>

        <video th:if="${issue.videoPath != null}"
               controls
               style="width:100%; border-radius:12px; margin-top:15px;">
            <source th:src="@{${issue.videoPath}}" type="video/mp4">
        </video>
    </div>

    <div class="card" th:if="${issue.latitude != null and issue.longitude != null}">
        <span class="label">Issue Location</span>
        <div id="issue-map"
             th:attr="data-lat=${issue.latitude}, data-lng=${issue.longitude}">
        </div>
    </div>

</div>

<footer>
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>
    © 2026 CivicSense | Smart Governance System
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const mapDiv = document.getElementById('issue-map');
    if(mapDiv){
        const lat = parseFloat(mapDiv.getAttribute('data-lat'));
        const lng = parseFloat(mapDiv.getAttribute('data-lng'));
        if(!isNaN(lat) && !isNaN(lng)){
            const map = L.map('issue-map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([lat, lng]).addTo(map);
        }
    }
</script>

</body>
</html>
