<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isAdmin} ? 'All Issues (Admin)' : 'My Issues'">Issues | CivicSense</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; margin:0; padding-top:70px; }

        /* ===================== NAVBAR ===================== */
        .logo{ display:flex; align-items:center; gap:8px; }
        .logo-icon{
            width:28px; height:28px;
            border-radius:50%;
            background:linear-gradient(135deg,#10b981,#059669);
            display:flex; align-items:center; justify-content:center;
            color:white; font-weight:700; font-size:14px;
            box-shadow:0 0 14px rgba(16,185,129,0.6); position:relative;
            animation:logoFloat 3s ease-in-out infinite alternate;
        }
        .navbar .logo h2 { color: #111827; font-size:20px; }

        .logo-icon::before{
            content:''; position:absolute; width:40px; height:40px;
            border-radius:50%;
            border:2px solid rgba(16,185,129,0.4);
            animation:rotateRing 6s linear infinite;
        }
        @keyframes rotateRing{from{ transform:rotate(0deg); } to{ transform:rotate(360deg); }}
        @keyframes logoFloat{
            0%{ transform:translateY(0px); box-shadow:0 0 8px rgba(16,185,129,0.5);}
            100%{ transform:translateY(-6px); box-shadow:0 0 22px rgba(16,185,129,0.9);}
        }

        .navbar{
            position:fixed; top:0; width:100%; height:70px; padding:10px 30px;
            display:flex; justify-content:space-between; align-items:center;
            background:rgba(255,255,255,0.75); backdrop-filter:blur(15px);
            box-shadow:0 6px 22px rgba(0,0,0,0.08); z-index:1000; transition:0.4s;
        }
        .navbar.scrolled{ padding:12px 30px; background:rgba(255,255,255,0.95); box-shadow:0 7px 28px rgba(0,0,0,0.12);}
        .navbar a{ text-decoration:none; margin-left:15px; color:#374151; font-weight:500; transition:.3s; }
        .navbar a:hover{ color:#059669; }
        .btn-nav{ background:linear-gradient(135deg,#10b981,#059669); color:white!important; padding:6px 14px; border-radius:20px; }
        .dark-toggle{ cursor:pointer; margin-left:15px; font-size:16px; }

        /* ===================== CONTAINER ===================== */
        .container { max-width: 1000px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .issue-image { max-width: 80px; max-height: 60px; border-radius: 4px; object-fit: cover; margin-right: 5px; }
        .btn-view, .btn-delete { padding: 6px 12px; border-radius: 5px; text-decoration: none; color: white; font-size: 14px; margin: 0 3px 3px 0; display: inline-block; cursor: pointer; border: none; }
        .btn-view { background-color: #2196F3; }
        .btn-view:hover { background-color: #0b7dda; }
        .btn-delete { background-color: #f44336; }
        .btn-delete:hover { background-color: #da190b; }
        .filters { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filters select, .filters button { padding: 6px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination a, .pagination span { margin: 0 5px; padding: 6px 12px; text-decoration: none; border-radius: 5px; }
        .pagination a { background-color: #eee; color: #333; }
        .pagination a:hover { background-color: #ccc; }
        .pagination span.current { background-color: #4CAF50; color: white; }
        .back-link { display: block; margin-top: 20px; text-align: center; color: #333; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .small-map { width: 120px; height: 80px; border-radius: 5px; }

        /* ========================= */
        /* Floating Back to Dashboard Button */
        /* ========================= */
        .floating-back {
            position: fixed;
            top: 90px;
            right: 20px;
            background-color: #007BFF;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
            z-index: 1000;
        }
        .floating-back:hover { background-color: #0056b3; }

        /* ===================== FOOTER ===================== */
        footer{
            background:#111827; color:#9ca3af; text-align:center; padding:15px;
            width:100%;
            font-size:13px;
        }
    </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar" id="navbar">
    <div class="logo">
        <div class="logo-icon">CS</div>
        <h2>CivicSense</h2>
    </div>
    <div>
        <a href="/">Home</a>
        <a href="/login">User</a>
        <a href="/login">Admin</a>
        <a href="/login">Department</a>
        <a href="/login">Login</a>
        <a href="/register" class="btn-nav">Register</a>
        <span class="dark-toggle" onclick="toggleDark()">🌙</span>
    </div>
</div>

<!-- Floating Back to Dashboard Button -->
<a th:href="${isAdmin} ? @{/admin/dashboard} : @{/user/dashboard}" class="floating-back">← Back to Dashboard</a>

<div class="container">
    <h1 th:text="${isAdmin} ? 'All Issues (Admin)' : 'My Issues'">Issues</h1>

    <!-- Filters -->
    <form th:action="@{/issues}" method="get" class="filters">
        <select name="category">
            <option value="">All Categories</option>
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat.toString() == selectedCategory}"></option>
        </select>

        <select name="status">
            <option value="">All Statuses</option>
            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st.toString() == selectedStatus}"></option>
        </select>

        <button type="submit">Filter</button>
    </form>

    <!-- Issues Table -->
    <table>
        <thead>
        <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th th:if="${isAdmin}">Submitted By</th>
            <th>Actions / Location</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="issue : ${issues}">
            <td>
                <img th:if="${issue.imagePath != null and issue.imagePath != ''}" th:src="@{${issue.imagePath}}" alt="Issue Image" class="issue-image"/>
            </td>
            <td th:text="${issue.title}">Title</td>
            <td th:text="${issue.category}">Category</td>
            <td th:text="${issue.status}">Status</td>
            <td th:if="${isAdmin}" th:text="${issue.user.username}">Username</td>
            <td>
                <div th:if="${issue.latitude != null and issue.longitude != null}" th:attr="id='map-' + ${issue.id}, data-lat=${issue.latitude}, data-lng=${issue.longitude}" class="small-map"></div>

                <div style="margin-top:5px;">
                    <a th:href="@{/issues/{id}(id=${issue.id})}" class="btn-view">View</a>
                    <form th:action="@{/issues/delete/{id}(id=${issue.id})}" method="post" style="display:inline-block">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn-delete" onclick="if(!confirm('Are you sure you want to delete this issue?')) event.preventDefault();">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(issues)}">
            <td colspan="6" style="text-align:center;">No issues found.</td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}" th:href="@{/issues(page=${currentPage-1}, category=${selectedCategory}, status=${selectedStatus})}">Prev</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages-1)}" th:classappend="${i == currentPage} ? ' current'">
            <a th:href="@{/issues(page=${i}, category=${selectedCategory}, status=${selectedStatus})}" th:text="${i + 1}"></a>
        </span>

        <a th:if="${currentPage < totalPages-1}" th:href="@{/issues(page=${currentPage+1}, category=${selectedCategory}, status=${selectedStatus})}">Next</a>
    </div>

    <!-- Back Button -->
    <a th:href="${isAdmin} ? @{/admin/dashboard} : @{/user/dashboard}" class="back-link">← Back to Dashboard</a>
</div>

<!-- ================= FOOTER ================= -->
<footer>
    <div class="logo" style="justify-content:center;margin-bottom:8px;">
        <div class="logo-icon">CS</div>
        <h2 style="color:white; font-size:16px;">CivicSense</h2>
    </div>
    © 2026 CivicSense | Smart Governance System
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    window.addEventListener("scroll",()=>{ document.getElementById("navbar").classList.toggle("scrolled",window.scrollY>50); });
    function toggleDark(){ document.body.classList.toggle("dark"); }

    document.querySelectorAll('.small-map').forEach(function(el){
        const lat = parseFloat(el.getAttribute('data-lat'));
        const lng = parseFloat(el.getAttribute('data-lng'));
        if (!isNaN(lat) && !isNaN(lng)) {
            const map = L.map(el.id, {zoomControl:false, dragging:false, scrollWheelZoom:false}).setView([lat, lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:''}).addTo(map);
            L.marker([lat, lng]).addTo(map);
        }
    });
</script>

</body>
</html>
